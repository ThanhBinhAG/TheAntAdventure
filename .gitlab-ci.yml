# GitLab CI
# - every branch: verify with the production Docker toolchain
# - main: package, migrate, deploy, and wait for the container healthcheck
#
# Runner: shell executor on vm06 (host Docker, no DinD).
# Secrets: $MNT_FDATA/sharing/.env.local
# Supabase secrets: share-supabase app-env ant-crm --show-secrets

stages:
  - verify
  - package

variables:
  NEXT_TELEMETRY_DISABLED: '1'
  DOCKER_BUILDKIT: '1'
  IMAGE_TAG: 'the-ant-adventures-crm:$CI_COMMIT_SHORT_SHA'
  IMAGE_LATEST: 'the-ant-adventures-crm:latest'
  MNT_FDATA: '/mnt/fdata/the_ant_adventures_crm'
  COMPOSE_PROJECT_NAME: 'the-ant-adventures-crm'

verify:
  stage: verify
  tags:
    - vm06-deploy-ant-admin
  interruptible: true
  script:
    - docker build --target verifier -t the-ant-adventures-crm:verify .

# Build image + run container on server Docker daemon — main only.
docker:
  stage: package
  tags:
    - vm06-deploy-ant-admin
  resource_group: crm-production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - |
      set -eu
      docker info

      BASE_ENV_FILE="$(sh scripts/docker-with-env.sh print)"
      DEPLOY_ENV_FILE="$(mktemp)"
      SUPABASE_ENV_FILE="$(mktemp)"
      trap 'rm -f "$DEPLOY_ENV_FILE" "$SUPABASE_ENV_FILE"' EXIT
      cp "$BASE_ENV_FILE" "$DEPLOY_ENV_FILE"

      # Fetch app-specific keys at deploy time; never print the returned secrets.
      # Remove canonical values inherited from the shared env so a stale key can
      # never win over the secret-manager values generated below.
      sed -i \
        -e '/^NEXT_PUBLIC_SUPABASE_ANON_KEY=/d' \
        -e '/^SUPABASE_SERVICE_ROLE_KEY=/d' \
        "$DEPLOY_ENV_FILE"
      share-supabase app-env ant-crm --show-secrets > "$SUPABASE_ENV_FILE"
      cat "$SUPABASE_ENV_FILE" >> "$DEPLOY_ENV_FILE"
      ANON_KEY="$(sed -n 's/^ANON_KEY=//p' "$SUPABASE_ENV_FILE" | tail -n 1)"
      SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY=//p' "$SUPABASE_ENV_FILE" | tail -n 1)"
      if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
        echo "ERROR: ant-crm secrets must include ANON_KEY and SERVICE_ROLE_KEY." >&2
        exit 1
      fi
      DB_URL="$(sed -n 's/^SUPABASE_DB_URL=//p' "$SUPABASE_ENV_FILE" | tail -n 1)"
      if [ -n "$DB_URL" ]; then
        # VM06's Postgres service is an internal non-TLS Docker endpoint. Preserve
        # an explicit SSL policy if ops later supplies one, otherwise disable TLS.
        case "$DB_URL" in
          *sslmode=*) ;;
          *\?*) DB_URL="${DB_URL}&sslmode=disable" ;;
          *) DB_URL="${DB_URL}?sslmode=disable" ;;
        esac
        sed -i '/^SUPABASE_DB_URL=/d' "$DEPLOY_ENV_FILE"
        printf 'SUPABASE_DB_URL=%s\n' "$DB_URL" >> "$DEPLOY_ENV_FILE"
      fi
      printf '\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
        "$ANON_KEY" "$SERVICE_ROLE_KEY" >> "$DEPLOY_ENV_FILE"
      unset ANON_KEY SERVICE_ROLE_KEY DB_URL
      printf '\nNEXT_PUBLIC_SUPABASE_URL=http://supabase-ant-crm-gateway:8000\n' >> "$DEPLOY_ENV_FILE"

      # Use VM06's persistent shared Redis, rather than creating a per-CRM Redis.
      # The marker is permanent: it records the logical DB allocated to this app.
      redis_cli() {
        docker exec shared_redis sh -c '
          REDISCLI_AUTH="$(cat /run/secrets/redis_password)"
          export REDISCLI_AUTH
          exec redis-cli --raw -n "$@"
        ' redis-cli "$@"
      }

      REDIS_DB=""
      for candidate in $(seq 1 15); do
        if [ -n "$(redis_cli "$candidate" --scan --pattern 'ant_crm*' | head -n 1)" ]; then
          REDIS_DB="$candidate"
          break
        fi
      done

      if [ -z "$REDIS_DB" ]; then
        for candidate in $(seq 1 15); do
          if [ "$(redis_cli "$candidate" DBSIZE)" = "0" ] \
            && [ "$(redis_cli "$candidate" SET ant_crm:registry the-ant-adventures-crm NX)" = "OK" ]; then
            REDIS_DB="$candidate"
            echo "Allocated Redis DB $REDIS_DB for ant_crm"
            break
          fi
        done
      else
        echo "Using registered Redis DB $REDIS_DB for ant_crm"
      fi

      if [ -z "$REDIS_DB" ]; then
        echo "ERROR: No empty shared Redis logical database is available for ant_crm." >&2
        exit 1
      fi

      # Persist the allocated DB number in the shared app env (without the Redis password).
      if grep -q '^REDIS_DB=' "$BASE_ENV_FILE"; then
        sed -i "s/^REDIS_DB=.*/REDIS_DB=$REDIS_DB/" "$BASE_ENV_FILE"
      else
        printf '\nREDIS_DB=%s\n' "$REDIS_DB" >> "$BASE_ENV_FILE"
      fi

      REDIS_PASSWORD="$(docker exec shared_redis sh -c 'cat /run/secrets/redis_password')"
      printf 'REDIS_URL=redis://:%s@shared_redis:6379/%s\n' "$REDIS_PASSWORD" "$REDIS_DB" >> "$DEPLOY_ENV_FILE"
      unset REDIS_PASSWORD

      export ENV_FILE="$DEPLOY_ENV_FILE"
      echo "Building with generated deployment environment"
      sh scripts/docker-with-env.sh build
      docker tag the-ant-adventures-crm:local "$IMAGE_TAG"
      docker tag the-ant-adventures-crm:local "$IMAGE_LATEST"
      if [ -n "${CI_REGISTRY:-}" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
        docker push "$IMAGE_LATEST"
      else
        echo "CI_REGISTRY not set — image kept on server Docker only."
      fi

      # `supabase db push` owns version tracking. It applies every migration on a
      # fresh database and exits without changes when the recorded versions match.
      # Do not mutate the database until the new image has built successfully.
      if ! grep -q '^SUPABASE_DB_URL=' "$DEPLOY_ENV_FILE"; then
        echo "ERROR: SUPABASE_DB_URL is required to apply Supabase migrations." >&2
        exit 1
      fi
      echo "Checking and applying pending Supabase migrations..."
      MIGRATOR_IMAGE="the-ant-adventures-crm:migrator-$CI_COMMIT_SHORT_SHA"
      DB_CONTAINER="$(docker ps -q \
        --filter 'label=com.docker.compose.project=ss_ant_crm' \
        --filter 'label=com.docker.compose.service=db')"
      if [ -z "$DB_CONTAINER" ]; then
        DB_CONTAINER="$(docker ps --format '{{.ID}} {{.Names}}' \
          | awk '$2 ~ /^(supabase-ant-crm|ss_ant_crm)-db(-[0-9]+)?$/ { print $1; exit }')"
      fi
      if [ -z "$DB_CONTAINER" ]; then
        echo "ERROR: Could not find the Supabase Postgres container for ss_ant_crm." >&2
        exit 1
      fi
      DB_NETWORK="$(docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{$network}}{{"\n"}}{{end}}' "$DB_CONTAINER" | head -n 1)"
      if [ -z "$DB_NETWORK" ]; then
        echo "ERROR: Could not determine the Supabase Postgres network." >&2
        exit 1
      fi
      docker build --target migrator -t "$MIGRATOR_IMAGE" .
      docker run --rm \
        --network "$DB_NETWORK" \
        --env-file "$DEPLOY_ENV_FILE" \
        "$MIGRATOR_IMAGE" \
        sh -ec 'npx --no-install supabase db push --db-url "$SUPABASE_DB_URL"'

      echo "Deploying container on server..."
      PREVIOUS_IMAGE_ID=""
      PREVIOUS_APP_ID="$(docker compose --env-file "$DEPLOY_ENV_FILE" ps -q app || true)"
      if [ -n "$PREVIOUS_APP_ID" ]; then
        PREVIOUS_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$PREVIOUS_APP_ID")"
      fi
      rollback() {
        if [ -z "$PREVIOUS_IMAGE_ID" ]; then
          echo "No previous CRM image is available for rollback." >&2
          return 1
        fi
        echo "Rolling back CRM to image $PREVIOUS_IMAGE_ID..." >&2
        docker tag "$PREVIOUS_IMAGE_ID" the-ant-adventures-crm:local
        sh scripts/docker-with-env.sh deploy
      }
      sh scripts/docker-with-env.sh deploy
      echo "Waiting for CRM healthcheck..."
      APP_ID="$(docker compose --env-file "$DEPLOY_ENV_FILE" ps -q app)"
      for attempt in $(seq 1 30); do
        STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$APP_ID")"
        if [ "$STATUS" = "healthy" ]; then
          echo "CRM is healthy."
          docker image prune -f || true
          exit 0
        fi
        if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ]; then
          docker logs "$APP_ID" --tail 100 || true
          rollback || true
          exit 1
        fi
        sleep 2
      done
      docker logs "$APP_ID" --tail 100 || true
      echo "ERROR: CRM did not become healthy within 60 seconds." >&2
      rollback || true
      exit 1
