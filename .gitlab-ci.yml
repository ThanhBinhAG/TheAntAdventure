# GitLab CI
# - main: package Docker image (env from /mnt/fdata/sharing)
# - other branches: lint + Next build (verify only)

stages:
  - verify
  - package

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  NEXT_TELEMETRY_DISABLED: '1'
  DOCKER_TLS_CERTDIR: '/certs'
  IMAGE_TAG: 'the-ant-adventures-crm:$CI_COMMIT_SHORT_SHA'
  IMAGE_LATEST: 'the-ant-adventures-crm:latest'
  MNT_FDATA: '/mnt/fdata/the_ant_adventures_crm/'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: verify
  image: node:20-alpine
  tags:
    - vm06-deploy-ant-admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run lint

build:
  stage: verify
  image: node:20-alpine
  tags:
    - vm06-deploy-ant-admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build

# Package production image — main only.
# Secrets: $MNT_FDATA/sharing/.env.local (runner must mount /mnt/fdata).
docker:
  stage: package
  image: docker:24-cli
  services:
    - docker:24-dind
  tags:
    - vm06-deploy-ant-admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - docker info
    - export ENV_FILE="$(sh scripts/docker-with-env.sh print)"
    - echo "Building with ENV_FILE=$ENV_FILE"
    - docker compose --env-file "$ENV_FILE" build
    - docker tag the-ant-adventures-crm:local "$IMAGE_TAG"
    - docker tag the-ant-adventures-crm:local "$IMAGE_LATEST"
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
        docker push "$IMAGE_LATEST"
      else
        echo "CI_REGISTRY not set — image built on runner only."
      fi
