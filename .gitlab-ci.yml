# GitLab CI — lint check only, no deploy

stages:
  - verify

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SENTRY_DSN: ''
  NEXT_PUBLIC_USE_SUPABASE: 'false'
  NEXT_PUBLIC_APP_VERSION: 'ci'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: verify
  image: node:20-alpine
  tags:
    - vm06-deploy-ant-admin
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run lint