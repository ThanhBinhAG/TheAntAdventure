# GitLab CI
# - main: build Docker image on the runner host + deploy (compose up)
# - other branches: lint + Next build (verify only)
#
# Runner: shell executor on vm06 (host Docker, no DinD).
# Secrets: $MNT_FDATA/sharing/.env.local

stages:
  - verify
  - package

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  NEXT_TELEMETRY_DISABLED: '1'
  IMAGE_TAG: 'the-ant-adventures-crm:$CI_COMMIT_SHORT_SHA'
  IMAGE_LATEST: 'the-ant-adventures-crm:latest'
  MNT_FDATA: '/mnt/fdata/the_ant_adventures_crm'
  COMPOSE_PROJECT_NAME: 'the-ant-adventures-crm'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: verify
  image: node:20-alpine
  tags:
    - vm06-deploy-ant-admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run lint

build:
  stage: verify
  image: node:20-alpine
  tags:
    - vm06-deploy-ant-admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: on_success
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build

# Build image + run container on server Docker daemon — main only.
docker:
  stage: package
  tags:
    - vm06-deploy-ant-admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - docker info
    - export ENV_FILE="$(sh scripts/docker-with-env.sh print)"
    - echo "Building with ENV_FILE=$ENV_FILE"
    - sh scripts/docker-with-env.sh build
    - docker tag the-ant-adventures-crm:local "$IMAGE_TAG"
    - docker tag the-ant-adventures-crm:local "$IMAGE_LATEST"
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
        docker push "$IMAGE_LATEST"
      else
        echo "CI_REGISTRY not set — image kept on server Docker only."
      fi
    - echo "Deploying container on server..."
    - sh scripts/docker-with-env.sh deploy
    - sh scripts/docker-with-env.sh status
