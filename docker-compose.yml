# Production / VM packaging for The Ant Adventures CRM.
# Env resolution (see scripts/docker-with-env.sh):
#   1) ENV_FILE if set
#   2) $MNT_FDATA/sharing/.env.local  (or env.local)
#   3) ./.env.local
#
#   npm run docker:up       # build + run on the existing host port upstream
#   npm run docker:deploy   # recreate from existing image (CI)
#   npm run docker:status
# The same host port is deliberately retained for the existing ingress/proxy
# configuration. A local Redis cache is defined in docker-compose.local.yml.
#
# COMPOSE_PROJECT_NAME defaults to the-ant-adventures-crm (set in script / CI).
# VM deploy uses shared_redis on network shared-services (REDIS_URL from env / CI).
# Proxy configuration is operated outside this repository.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-ant-adventures-crm:local
    ports:
      - "${APP_PORT:-3006}:3006"
    env_file:
      - ${ENV_FILE:-/mnt/fdata/sharing/.env.local}
    environment:
      NODE_ENV: production
      PORT: 3006
      HOSTNAME: 0.0.0.0
      # Keep V8 heap under mem_limit so OOM is controllable (not host-wide kill).
      NODE_OPTIONS: --max-old-space-size=1536

    networks:
      - ss_ant_crm_app
      - shared-services

    # Caps the app at 2 GB so a runaway request is killed inside the container instead of
    # letting the kernel pick a victim host-wide. Measured peak for image processing is
    # ~130 MB (Sharp runs in a short-lived child worker), so this is generous headroom.
    mem_limit: 2g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3006/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Optional local cache only. Production uses shared_redis via REDIS_URL and
  # never starts this profile during deployment.
  redis:
    profiles: ["local-cache"]
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  # Supabase ant-crm stack network; resolves supabase-ant-crm-gateway.
  ss_ant_crm_app:
    external: true
  # VM06 shared Redis network; resolves shared_redis.
  shared-services:
    external: true
